<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Football League</title>
    <style>
        /* --- General Setup --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            color: #fdd835;
            margin-bottom: 5px;
            font-style: italic;
            text-shadow: 2px 2px #000;
        }

        /* --- Scoreboard Header --- */
        .scoreboard {
            background-color: #22252d;
            border: 3px solid #333;
            border-radius: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 500px;
            padding: 10px 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .team-score {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .team-name {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }

        .points {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
        }

        .vs-box {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fdd835;
            background-color: #111;
            padding: 5px 15px;
            border-radius: 6px;
        }

        /* --- Pitch Canvas Frame --- */
        .game-container {
            position: relative;
        }

        canvas {
            background-color: #2e7d32; /* Pitch Green */
            border: 5px solid #fff;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* --- Controls Dashboard Info --- */
        .controls-guide {
            margin-top: 15px;
            background-color: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.4;
        }

        .highlight-key {
            background-color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <h1>KICKOFF CHAMPIONS</h1>
    
    <!-- Scoreboard Tracker Matrix -->
    <div class="scoreboard">
        <div class="team-score">
            <span class="team-name" style="color: #ff3d00;">Player (Red)</span>
            <span class="points" id="playerScore">0</span>
        </div>
        <div class="vs-box">LIVE</div>
        <div class="team-score">
            <span class="team-name" style="color: #2979ff;">AI Bot (Blue)</span>
            <span class="points" id="aiScore">0</span>
        </div>
    </div>

    <!-- Active Field Render Box -->
    <div class="game-container">
        <canvas id="pitchCanvas" width="800" height="450"></canvas>
    </div>

    <!-- Interactive On-Screen Manual Guide -->
    <div class="controls-guide">
        Use keys <span class="highlight-key">W</span> <span class="highlight-key">A</span> <span class="highlight-key">S</span> <span class="highlight-key">D</span> or Arrow Keys to move your soccer player.<br>
        Run into the soccer ball to dribble or push it past the defense into the right goalpost to score!
    </div>

    <script>
        const canvas = document.getElementById('pitchCanvas');
        const ctx = canvas.getContext('2d');

        const pScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');

        // Score Trackers
        let scores = { player: 0, ai: 0 };

        // Keyboard Tracking Buffer
        const keys = {};

        // Object Dimensions & Setup Variables
        const playerRadius = 15;
        const ballRadius = 10;
        const goalWidth = 10;
        const goalHeight = 120;
        const goalY = (canvas.height / 2) - (goalHeight / 2);

        // Game Entities Initial State Machine
        let player = { x: 150, y: canvas.height / 2, speed: 4, color: '#ff3d00' };
        let aiBot = { x: 650, y: canvas.height / 2, speed: 2.8, color: '#2979ff' };
        let ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, friction: 0.98 };

        // Handle Event Listeners Input Hooks
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Core Reset Logic After Goals
        function resetPositions() {
            player.x = 150;
            player.y = canvas.height / 2;
            aiBot.x = 650;
            aiBot.y = canvas.height / 2;
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.vx = 0;
            ball.vy = 0;
        }

        // Distance Vector Geometry Helper
        function getDistance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }

        // Processing Logic Handling Physics Loops
        function updateGame() {
            // --- 1. Process User Player Movements ---
            if (keys['w'] || keys['arrowup']) player.y -= player.speed;
            if (keys['s'] || keys['arrowdown']) player.y += player.speed;
            if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
            if (keys['d'] || keys['arrowright']) player.x += player.speed;

            // Contain player inside pitch boundaries
            player.x = Math.max(playerRadius, Math.min(canvas.width - playerRadius, player.x));
            player.y = Math.max(playerRadius, Math.min(canvas.height - playerRadius, player.y));

            // --- 2. Advanced AI Tracker Processing ---
            // The AI tracks where the ball travels and smoothly routes towards it
            if (aiBot.y < ball.y - 5) aiBot.y += aiBot.speed;
            else if (aiBot.y > ball.y + 5) aiBot.y -= aiBot.speed;

            if (aiBot.x < ball.x - 5) aiBot.x += aiBot.speed;
            else if (aiBot.x > ball.x + 5) aiBot.x -= aiBot.speed;

            // Contain AI inside pitch boundaries
            aiBot.x = Math.max(playerRadius, Math.min(canvas.width - playerRadius, aiBot.x));
            aiBot.y = Math.max(playerRadius, Math.min(canvas.height - playerRadius, aiBot.y));

            // --- 3. Run Ball Physics Calculations ---
            ball.vx *= ball.friction;
            ball.vy *= ball.friction;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Wall Collisions
            if (ball.y - ballRadius <= 0 || ball.y + ballRadius >= canvas.height) {
                ball.vy = -ball.vy;
                ball.y = ball.y - ballRadius <= 0 ? ballRadius : canvas.height - ballRadius;
            }
            if (ball.x - ballRadius <= 0 || ball.x + ballRadius >= canvas.width) {
                // If it crashes inside goal range coordinates, don't bounce out completely
                if (ball.y < goalY || ball.y > goalY + goalHeight) {
                    ball.vx = -ball.vx;
                    ball.x = ball.x - ballRadius <= 0 ? ballRadius : canvas.width - ballRadius;
                }
            }

            // --- 4. Circle-to-Circle Collision Checkers (Kicking) ---
            // Player vs Ball
            let distToPlayer = getDistance(player.x, player.y, ball.x, ball.y);
            if (distToPlayer < playerRadius + ballRadius) {
                let angle = Math.atan2(ball.y - player.y, ball.x - player.x);
                let power = 7; // Kick impulse velocity factor
                ball.vx = Math.cos(angle) * power;
                ball.vy = Math.sin(angle) * power;
            }

            // AI vs Ball
            let distToAI = getDistance(aiBot.x, aiBot.y, ball.x, ball.y);
            if (distToAI < playerRadius + ballRadius) {
                let angle = Math.atan2(ball.y - aiBot.y, ball.x - aiBot.x);
                let power = 6.5; 
                ball.vx = Math.cos(angle) * power;
                ball.vy = Math.sin(angle) * power;
            }

            // --- 5. Goal Zone Validation Sweeper ---
            // Left Goal Check (AI Scores)
            if (ball.x - ballRadius <= 12 && ball.y >= goalY && ball.y <= goalY + goalHeight) {
                scores.ai++;
                aiScoreEl.innerText = scores.ai;
                resetPositions();
            }
            // Right Goal Check (Player Scores)
            if (ball.x + ballRadius >= canvas.width - 12 && ball.y >= goalY && ball.y <= goalY + goalHeight) {
                scores.player++;
                pScoreEl.innerText = scores.player;
                resetPositions();
            }
        }

        // Field Render Paint Canvas Pipeline
        function drawGame() {
            // Clear Frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pitch markings styling
            ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.lineWidth = 4;

            // Center Line
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Center Circle
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
            ctx.stroke();

            // Render Left Goal Post Net
            ctx.fillStyle = "#fff";
        }
